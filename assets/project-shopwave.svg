<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#141c38" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#shop-bg)" rx="16" />

  <g transform="translate(60, 45)">
    <!-- Nav header -->
    <rect width="680" height="55" rx="10" fill="#131e3d" stroke="#223361" stroke-width="1" />
    <text x="25" y="34" fill="#fb923c" font-family="sans-serif" font-size="16" font-weight="bold">ShopWave.</text>
    <rect x="150" y="14" width="260" height="28" rx="14" fill="#0c1428" />
    <text x="175" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Search products, tech, gadgets...</text>
    
    <!-- Cart badge -->
    <rect x="580" y="14" width="75" height="28" rx="14" fill="#f97316" />
    <text x="617" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cart (3)</text>

    <!-- Product Grid -->
    <!-- Product 1 -->
    <g transform="translate(0, 80)">
      <rect width="210" height="280" rx="10" fill="#131e3d" stroke="#223361" stroke-width="1" />
      <rect x="15" y="15" width="180" height="130" rx="8" fill="#1a274e" />
      <!-- Stylized item graphic -->
      <circle cx="105" cy="80" r="35" fill="#f97316" opacity="0.3" />
      <circle cx="105" cy="80" r="22" fill="#fb923c" />
      <text x="20" y="175" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Sonic ANC Pro</text>
      <text x="20" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Wireless Noise Canceling</text>
      <text x="20" y="235" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">$249.00</text>
      <rect x="120" y="215" width="75" height="28" rx="6" fill="#f97316" />
      <text x="157" y="233" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(235, 80)">
      <rect width="210" height="280" rx="10" fill="#131e3d" stroke="#223361" stroke-width="1" />
      <rect x="15" y="15" width="180" height="130" rx="8" fill="#1a274e" />
      <rect x="80" y="60" width="50" height="50" rx="6" fill="#3b82f6" />
      <text x="20" y="175" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">UltraWatch Ultra</text>
      <text x="20" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Titanium Case • GPS</text>
      <text x="20" y="235" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">$399.00</text>
      <rect x="120" y="215" width="75" height="28" rx="6" fill="#f97316" />
      <text x="157" y="233" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(470, 80)">
      <rect width="210" height="280" rx="10" fill="#131e3d" stroke="#223361" stroke-width="1" />
      <rect x="15" y="15" width="180" height="130" rx="8" fill="#1a274e" />
      <!-- Stylized item graphic -->
      <polygon points="105,50 140,110 70,110" fill="#10b981" />
      <text x="20" y="175" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Studio Ergonomic Mouse</text>
      <text x="20" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Dual Wireless 2.4G &amp; BT</text>
      <text x="20" y="235" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">$89.00</text>
      <rect x="120" y="215" width="75" height="28" rx="6" fill="#f97316" />
      <text x="157" y="233" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Add to Cart</text>
    </g>
  </g>
</svg>
