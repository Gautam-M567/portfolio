<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d24" />
      <stop offset="100%" stop-color="#1f1140" />
    </linearGradient>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ai-bg)" rx="16" />

  <!-- Glowing orb -->
  <circle cx="650" cy="150" r="140" fill="#ec4899" opacity="0.12" filter="blur(50px)" />

  <g transform="translate(80, 50)">
    <!-- Header -->
    <rect width="640" height="60" rx="10" fill="#1b1638" stroke="#332463" stroke-width="1" />
    <circle cx="35" cy="30" r="14" fill="url(#pink-grad)" />
    <text x="35" y="34" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI</text>
    <text x="65" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">NeuroTask AI • Priority Optimizer</text>
    <rect x="520" y="16" width="100" height="28" rx="14" fill="#3b1d5a" />
    <text x="570" y="34" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Deep Focus ON</text>

    <!-- Task 1: High Urgency -->
    <g transform="translate(0, 80)">
      <rect width="640" height="75" rx="10" fill="#181333" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="35" cy="38" r="8" fill="#f43f5e" />
      <text x="60" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Refactor Auth Microservice to JWT v2</text>
      <text x="60" y="54" fill="#9ca3af" font-family="sans-serif" font-size="11">AI Confidence: 94% • Est. Duration: 1h 45m • Deadline in 3 hours</text>
      <rect x="520" y="24" width="95" height="28" rx="6" fill="#f43f5e" />
      <text x="567" y="42" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Start Sprint</text>
    </g>

    <!-- Task 2: Medium Urgency -->
    <g transform="translate(0, 170)">
      <rect width="640" height="75" rx="10" fill="#181333" stroke="#332463" stroke-width="1" />
      <circle cx="35" cy="38" r="8" fill="#eab308" />
      <text x="60" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Review PR #142: Real-Time Webhook Engine</text>
      <text x="60" y="54" fill="#9ca3af" font-family="sans-serif" font-size="11">AI Confidence: 88% • Est. Duration: 35m • Team blocked</text>
      <rect x="520" y="24" width="95" height="28" rx="6" fill="#2d2254" />
      <text x="567" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Queue</text>
    </g>

    <!-- Task 3: Low Urgency -->
    <g transform="translate(0, 260)">
      <rect width="640" height="75" rx="10" fill="#181333" stroke="#332463" stroke-width="1" />
      <circle cx="35" cy="38" r="8" fill="#10b981" />
      <text x="60" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Update API Documentation &amp; OpenAPI Spec</text>
      <text x="60" y="54" fill="#9ca3af" font-family="sans-serif" font-size="11">AI Suggestion: Schedule for Tomorrow 10:00 AM</text>
      <rect x="520" y="24" width="95" height="28" rx="6" fill="#2d2254" />
      <text x="567" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Scheduled</text>
    </g>
  </g>
</svg>
