<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="audio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#audio-bg)" rx="16" />

  <!-- Oscilloscope Waveform Display -->
  <g transform="translate(60, 45)">
    <rect width="680" height="170" rx="10" fill="#040711" stroke="#0ea5e9" stroke-width="1.5" />
    <!-- Oscilloscope Grid Lines -->
    <line x1="0" y1="85" x2="680" y2="85" stroke="#0369a1" stroke-width="1" stroke-opacity="0.3" />
    <line x1="340" y1="0" x2="340" y2="170" stroke="#0369a1" stroke-width="1" stroke-opacity="0.3" />

    <!-- Wave 1 (Cyan Sine Wave) -->
    <path d="M 0,85 Q 42.5,15 85,85 T 170,85 T 255,85 T 340,85 T 425,85 T 510,85 T 595,85 T 680,85" fill="none" stroke="#22d3ee" stroke-width="3" />
    <!-- Wave 2 (Pink Harmonics) -->
    <path d="M 0,85 Q 21.25,45 42.5,85 T 85,85 T 127.5,85 T 170,85 T 212.5,85 T 255,85 T 297.5,85 T 340,85 T 382.5,85 T 425,85 T 467.5,85 T 510,85 T 552.5,85 T 595,85 T 637.5,85 T 680,85" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.7" />

    <text x="25" y="30" fill="#38bdf8" font-family="monospace" font-size="12">OSC 1: SINE 440Hz • 128 BPM</text>
    <circle cx="655" cy="25" r="5" fill="#ef4444" />
    <text x="640" y="29" fill="#ef4444" font-family="monospace" font-size="11" text-anchor="end">REC</text>
  </g>

  <!-- Step Sequencer Mockup -->
  <g transform="translate(60, 240)">
    <rect width="680" height="200" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">16-Step Pattern Sequencer</text>

    <!-- Track 1: Kick -->
    <text x="25" y="70" fill="#94a3b8" font-family="monospace" font-size="11">KICK</text>
    <g transform="translate(90, 55)">
      <!-- 16 steps -->
      <rect x="0" width="30" height="22" rx="4" fill="#06b6d4" />
      <rect x="35" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="70" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="105" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="145" width="30" height="22" rx="4" fill="#06b6d4" />
      <rect x="180" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="215" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="250" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="290" width="30" height="22" rx="4" fill="#06b6d4" />
      <rect x="325" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="360" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="395" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="435" width="30" height="22" rx="4" fill="#06b6d4" />
      <rect x="470" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="505" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="540" width="30" height="22" rx="4" fill="#1e293b" />
    </g>

    <!-- Track 2: Snare -->
    <text x="25" y="115" fill="#94a3b8" font-family="monospace" font-size="11">SNARE</text>
    <g transform="translate(90, 100)">
      <rect x="0" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="35" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="70" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="105" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="145" width="30" height="22" rx="4" fill="#ec4899" />
      <rect x="180" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="215" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="250" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="290" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="325" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="360" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="395" width="30" height="22" rx="4" fill="#1e293b" />

      <rect x="435" width="30" height="22" rx="4" fill="#ec4899" />
      <rect x="470" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="505" width="30" height="22" rx="4" fill="#1e293b" />
      <rect x="540" width="30" height="22" rx="4" fill="#1e293b" />
    </g>

    <!-- Track 3: HiHat -->
    <text x="25" y="160" fill="#94a3b8" font-family="monospace" font-size="11">HIHAT</text>
    <g transform="translate(90, 145)">
      <rect x="0" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="35" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="70" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="105" width="30" height="22" rx="4" fill="#a855f7" />

      <rect x="145" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="180" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="215" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="250" width="30" height="22" rx="4" fill="#a855f7" />

      <rect x="290" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="325" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="360" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="395" width="30" height="22" rx="4" fill="#a855f7" />

      <rect x="435" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="470" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="505" width="30" height="22" rx="4" fill="#a855f7" />
      <rect x="540" width="30" height="22" rx="4" fill="#a855f7" />
    </g>
  </g>
</svg>
